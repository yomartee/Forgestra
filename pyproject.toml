[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgestra"
version = "0.2.0.dev0"
description = "Offline repository inspection with disabled privileged automation"
requires-python = ">=3.14,<3.15"
dependencies = []
# Limited owned first-party Apache-2.0 intent is recorded; see docs/PROVENANCE.md.
# Unresolved scope/notices prevent a package-wide SPDX license assertion.

[project.optional-dependencies]
dev = ["black==26.10.1", "flake8==7.4.1", "mypy==2.4.0"]

[project.scripts]
forgestra = "forgestra.cli:main"

[tool.setuptools]
packages = ["forgestra"]
py-modules = ["forgestra_safety", "inspect_local"]
include-package-data = false

[tool.setuptools.package-dir]
"" = "scripts"
forgestra = "src/forgestra"

[tool.setuptools.package-data]
forgestra = ["web_assets/*.txt", "web_assets/*.json"]

[tool.black]
line-length = 100

